# Hexo 站点配置 —— PRINTFILM 工作记录
# Site
title: 工作记录
subtitle: PRINTFILM 研发日志与周报
description: 按周沉淀的研发交付记录：功能、修复、发版与复盘
keywords:
  - 工作记录
  - 周报
  - PRINTFILM
author: yi
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://worklog.yizone.top
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: 工作记录
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: redefine

# ==========================================
# hexo-blog-encrypt 文章加密
# ==========================================
encrypt:
  # 全局默认密码（所有文章共用）
  password: 2099
  # 提示文字
  abstract: 已加密，请输入密码访问
  message: 请输入访问密码
  wrong_pass_message: 密码错误，请重试
  # 记住密码
  autoSave: true
  # 加密主题
  theme: default
  # 静默模式（不输出加密日志）
  silent: false
